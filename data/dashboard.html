<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>类目抓取看板</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f1117; color: #e0e0e0; padding: 20px; }

    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    h1 { font-size: 20px; color: #7eb8f7; }

    .ctrl-btn {
      padding: 8px 24px; border: none; border-radius: 6px; font-size: 14px;
      font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .ctrl-btn.running { background: #e74c3c; color: #fff; }
    .ctrl-btn.running:hover { background: #c0392b; }
    .ctrl-btn.paused  { background: #27ae60; color: #fff; }
    .ctrl-btn.paused:hover  { background: #1e8449; }

    .stats { display: flex; gap: 14px; margin-bottom: 16px; flex-wrap: wrap; }
    .stat-card {
      background: #1a1d27; border: 1px solid #2a2d3e;
      border-radius: 8px; padding: 12px 18px; min-width: 130px;
    }
    .stat-card .label { font-size: 11px; color: #888; margin-bottom: 4px; }
    .stat-card .value { font-size: 26px; font-weight: 700; color: #7eb8f7; }
    .stat-card .value.warn { color: #f7b731; }

    .filters { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; flex-wrap: wrap; }
    .filters input, .filters select {
      background: #1a1d27; border: 1px solid #2a2d3e; color: #e0e0e0;
      padding: 6px 12px; border-radius: 6px; font-size: 13px;
    }
    .filters input { width: 240px; }
    .filters select { width: 100px; }
    .filters label { font-size: 12px; color: #888; }

    .refresh-info { font-size: 11px; color: #555; margin-bottom: 10px; }
    .refresh-info span { color: #7eb8f7; }
    .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .status-dot.running { background: #27ae60; }
    .status-dot.paused  { background: #f7b731; }

    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: #1a1d27; color: #888; text-align: left;
      padding: 8px 10px; border-bottom: 1px solid #2a2d3e;
      position: sticky; top: 0; cursor: pointer;
    }
    th:hover { color: #7eb8f7; }
    td { padding: 6px 10px; border-bottom: 1px solid #1e2130; }
    tr:hover td { background: #1a1d27; }
    .has-id { color: #4caf82; font-weight: 600; }
    .no-id  { color: #555; }
    .depth-badge {
      display: inline-block; padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 700;
    }
    .d1 { background: #1a3a2a; color: #4caf82; }
    .d2 { background: #1a2a3a; color: #5dade2; }
    .d3 { background: #2a2a1a; color: #f7dc6f; }
    .d4 { background: #3a2a1a; color: #f0b27a; }
    .d5 { background: #3a1a1a; color: #e74c3c; }
    .source-bc { color: #f7b731; font-size: 11px; }
    .source-sb { color: #555; font-size: 11px; }
    .url-cell { color: #4a7fb5; font-size: 11px; max-width: 380px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ─── Tab ─────────────────────────────────── */
    .tab-bar { display: flex; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid #2a2d3e; }
    .tab {
      padding: 6px 20px; border: none; background: transparent;
      color: #888; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent;
      transition: all 0.18s;
    }
    .tab.active { color: #7eb8f7; border-bottom-color: #7eb8f7; }
    .tab:hover:not(.active) { color: #ccc; }



    /* ─── 榜单按钮 ─────────────────────────────── */
    .list-btns { display: flex; gap: 4px; flex-wrap: nowrap; }
    .lb {
      padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600;
      border: none; cursor: pointer; text-decoration: none; display: inline-block;
      transition: opacity 0.15s, transform 0.1s;
    }
    .lb:hover { opacity: 0.85; transform: scale(1.05); }
    .lb-unknown { background: #2a2d3e; color: #555; cursor: default; }
    .lb-valid   { background: #1a3a2a; color: #4caf82; }
    .lb-invalid { background: #2a1a1a; color: #555; cursor: default; text-decoration: line-through; }
    .lb-checking{ background: #2a2a1a; color: #f7dc6f; cursor: default; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }
    .row-refresh {
      padding: 2px 6px; font-size: 10px; background: none;
      border: 1px solid #2a2d3e; color: #555; border-radius: 4px; cursor: pointer;
    }
    .row-refresh:hover { color: #7eb8f7; border-color: #7eb8f7; }

    /* ─── 验证进度条 ───────────────────────────── */
    .check-bar-wrap {
      display: none; margin-bottom: 10px; background: #1a1d27;
      border: 1px solid #2a2d3e; border-radius: 6px; padding: 8px 14px;
    }
    .check-bar-wrap.active { display: block; }
    .check-bar-header { display: flex; justify-content: space-between; font-size: 11px; color: #888; margin-bottom: 6px; }
    .check-bar-track { height: 6px; background: #2a2d3e; border-radius: 3px; overflow: hidden; }
    .check-bar-fill  { height: 100%; background: linear-gradient(90deg,#4caf82,#7eb8f7); border-radius: 3px; transition: width 0.5s; }
    .check-counts { display: flex; gap: 12px; margin-top: 6px; font-size: 10px; }
    .check-counts span { color: #4caf82; }
  </style>
</head>
<body>

<div class="header">
  <h1>📦 Amazon 类目抓取看板</h1>
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
    <button class="ctrl-btn paused" id="ctrlBtn" onclick="togglePause()">▶ 启动抓取</button>
    <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:#888;">
      <span class="status-dot paused" id="statusDot"></span>
      <span id="statusText">爬虫未运行</span>
    </div>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><div class="label">总节点数</div><div class="value" id="total">—</div></div>
  <div class="stat-card"><div class="label">待处理队列</div><div class="value warn" id="queue">—</div></div>
  <div class="stat-card"><div class="label">有 node_id</div><div class="value" id="has_id">—</div></div>
  <div class="stat-card"><div class="label">面包屑发现</div><div class="value" id="breadcrumb">—</div></div>
  <div class="stat-card"><div class="label">阶段</div><div class="value" id="phase" style="font-size:14px">—</div></div>
</div>

<div class="refresh-info">
  实时刷新 | 上次更新：<span id="last_update">—</span>
</div>

<div class="tab-bar">
  <button class="tab active" id="tabList" onclick="switchTab('list')">&#9776; 列表视图</button>
  <button class="tab" id="tabProducts" onclick="switchTab('products')">&#128202; 商品抓取</button>
</div>

<div id="listView">

<div class="filters">
  <input type="text" id="search" placeholder="搜索类目名 / node_id ..." oninput="renderTable()">
  <label>层级：</label>
  <select id="depthFilter" onchange="renderTable()">
    <option value="all">全部</option>
    <option value="1">L1</option>
    <option value="2">L2</option>
    <option value="3">L3</option>
    <option value="4">L4</option>
    <option value="5">L5+</option>
  </select>
  <button onclick="startCheckAll()" style="margin-left:auto;padding:5px 14px;font-size:12px;background:#1a2a3a;color:#7eb8f7;border:1px solid #2a3a5a;border-radius:5px;cursor:pointer">🔍 一键验证榜单链接</button>
</div>

<div class="check-bar-wrap" id="checkBar">
  <div class="check-bar-header">
    <span>链接验证进度</span>
    <span id="checkBarText">—</span>
  </div>
  <div class="check-bar-track"><div class="check-bar-fill" id="checkBarFill" style="width:0%"></div></div>
  <div class="check-counts" id="checkCounts"></div>
</div>

<table>
  <thead>
    <tr>
      <th style="width:50px">#</th>
      <th>类目名</th>
      <th style="width:60px">L级</th>
      <th style="width:130px">node_id</th>
      <th style="width:70px">来源</th>
      <th>榜单链接</th>
      <th style="width:36px"></th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

</div><!-- /listView -->



<!-- ── 商品抓取面板 ────────────────────────────────────────── -->
<div id="productsView" style="display:none;margin-top:8px">

  <!-- 统计卡片 -->
  <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px">
    <div class="stat-card"><div class="label">去重商品</div><div class="value" id="p_total">—</div></div>
    <div class="stat-card"><div class="label">多榜出现</div><div class="value" style="color:#f7b731" id="p_multi">—</div></div>
    <div class="stat-card"><div class="label">新品榜</div><div class="value" id="p_nr">—</div></div>
    <div class="stat-card"><div class="label">畅销榜</div><div class="value" id="p_bs">—</div></div>
    <div class="stat-card"><div class="label">心愿单</div><div class="value" id="p_mw">—</div></div>
  </div>

  <!-- 左右布局 -->
  <div style="display:flex;gap:16px;align-items:flex-start">

    <!-- 左侧：类目树（带勾选） -->
    <div style="width:320px;min-width:280px;background:#141824;border:1px solid #2a2d3e;border-radius:8px;padding:12px;display:flex;flex-direction:column;max-height:60vh">
      <div style="font-size:13px;color:#aaa;font-weight:600;margin-bottom:6px">
        选择类目分支 <span id="p_sel_count" style="color:#7eb8f7;font-size:11px;margin-left:6px">0 个已选</span>
      </div>
      <!-- 搜索框 -->
      <input id="pTreeSearch" type="text" placeholder="搜索类目名..." oninput="filterPTree(this.value)"
        style="width:100%;box-sizing:border-box;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:5px 8px;font-size:12px;margin-bottom:6px">
      <!-- 树节点容器 -->
      <div id="pTreeRoot" style="font-size:12px;color:#ccc;overflow-y:auto;flex:1">
        <div style="color:#555">⏳ 点击加载类目树...</div>
      </div>
    </div>

    <!-- 右侧：参数 + 操作 -->
    <div style="flex:1;min-width:0">

      <!-- 榜单子标签 -->
      <div style="background:#141824;border:1px solid #2a2d3e;border-radius:8px;padding:0;margin-bottom:12px;overflow:hidden">
        <!-- sub-tab bar -->
        <div style="display:flex;border-bottom:1px solid #2a2d3e" id="listTabBar">
          <button class="list-tab active" onclick="switchListTab('nr')" id="ltab_nr" style="flex:1;padding:8px 0;background:none;color:#7eb8f7;border:none;border-bottom:2px solid #7eb8f7;cursor:pointer;font-size:12px">📋 新品榜</button>
          <button class="list-tab" onclick="switchListTab('bs')" id="ltab_bs" style="flex:1;padding:8px 0;background:none;color:#888;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:12px">📋 畅销榜</button>
          <button class="list-tab" onclick="switchListTab('mw')" id="ltab_mw" style="flex:1;padding:8px 0;background:none;color:#888;border:none;border-bottom:2px solid transparent;cursor:pointer;font-size:12px">📋 心愿单</button>
        </div>

        <!-- 新品榜面板 -->
        <div id="lp_nr" class="list-panel" style="padding:10px 12px">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label style="font-size:12px;color:#ccc;white-space:nowrap"><input type="checkbox" id="len_nr" checked> 启用</label>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">评论≤</span><input type="number" id="rv_nr" value="10" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">活体≥</span><input type="number" id="ml_nr" value="100" min="0" max="100" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">价格$</span><input type="number" id="pmin_nr" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="color:#555">—</span><input type="number" id="pmax_nr" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="font-size:9px;color:#555">0=不限</span></div>
          </div>
        </div>

        <!-- 畅销榜面板 -->
        <div id="lp_bs" class="list-panel" style="padding:10px 12px;display:none">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label style="font-size:12px;color:#ccc;white-space:nowrap"><input type="checkbox" id="len_bs" checked> 启用</label>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">评论≤</span><input type="number" id="rv_bs" value="10" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">活体≥</span><input type="number" id="ml_bs" value="100" min="0" max="100" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">价格$</span><input type="number" id="pmin_bs" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="color:#555">—</span><input type="number" id="pmax_bs" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="font-size:9px;color:#555">0=不限</span></div>
          </div>
        </div>

        <!-- 心愿单面板 -->
        <div id="lp_mw" class="list-panel" style="padding:10px 12px;display:none">
          <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
            <label style="font-size:12px;color:#ccc;white-space:nowrap"><input type="checkbox" id="len_mw" checked> 启用</label>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">评论≤</span><input type="number" id="rv_mw" value="10" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">活体≥</span><input type="number" id="ml_mw" value="100" min="0" max="100" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"></div>
            <div style="display:flex;align-items:center;gap:3px"><span style="font-size:11px;color:#888">价格$</span><input type="number" id="pmin_mw" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="color:#555">—</span><input type="number" id="pmax_mw" value="0" min="0" style="width:56px;background:#0d1117;color:#ccc;border:1px solid #2a3a5a;border-radius:4px;padding:4px;font-size:12px"><span style="font-size:9px;color:#555">0=不限</span></div>
          </div>
        </div>
      </div>

      <!-- 操作按钮 -->
      <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px">
        <button id="btnStartProducts" onclick="startProducts()"
          style="padding:7px 18px;background:#1a3a2a;color:#5fdb8a;border:1px solid #2a5a3a;border-radius:6px;cursor:pointer;font-size:13px">
          ▶ 开始抓取
        </button>
        <button onclick="stopProducts()"
          style="padding:7px 18px;background:#3a1a1a;color:#f07070;border:1px solid #5a2a2a;border-radius:6px;cursor:pointer;font-size:13px">
          ⏹ 停止
        </button>
        <button onclick="exportExcel()"
          style="padding:7px 18px;background:#1a2a3a;color:#7eb8f7;border:1px solid #2a3a5a;border-radius:6px;cursor:pointer;font-size:13px">
          📥 导出 Excel
        </button>
        <span id="p_status" style="font-size:12px;color:#888">就绪</span>
      </div>

      <!-- 进度条 -->
      <div style="background:#0d1117;border-radius:4px;overflow:hidden;height:6px;margin-bottom:6px">
        <div id="p_bar" style="height:100%;width:0%;background:linear-gradient(90deg,#5fdb8a,#7eb8f7);transition:width 1s"></div>
      </div>
      <div id="p_progress_text" style="font-size:11px;color:#555">—</div>

    </div><!-- /右侧 -->
  </div><!-- /左右布局 -->

</div><!-- /productsView -->

<script>
// ── Tab 切换 ──────────────────────────────────────────────────────
function switchTab(tab) {
  document.getElementById('listView').style.display     = tab === 'list'     ? '' : 'none';
  document.getElementById('productsView').style.display = tab === 'products' ? '' : 'none';
  document.getElementById('tabList').className     = 'tab' + (tab === 'list'     ? ' active' : '');
  document.getElementById('tabProducts').className = 'tab' + (tab === 'products' ? ' active' : '');
  if (tab === 'products') initProductsTab();
}



let allNodes = [];
let isPaused = false;

async function load() {
  try {
    // 从 API 获取统计
    const sr = await fetch('/api/stats?t=' + Date.now());
    if (!sr.ok) throw new Error('HTTP ' + sr.status);
    const stats = await sr.json();
    document.getElementById('total').textContent     = stats.total || '—';
    document.getElementById('queue').textContent     = stats.queue ?? '—';
    document.getElementById('has_id').textContent    = stats.has_id || 0;
    document.getElementById('breadcrumb').textContent = stats.breadcrumb || 0;

    // 从 API 获取状态
    try {
      const str = await fetch('/api/status?t=' + Date.now());
      const st = await str.json();
      document.getElementById('phase').textContent =
        st.phase === 'sidebar_bfs' ? '侧边栏BFS' :
        st.phase === 'breadcrumb'  ? '面包屑' :
        st.phase === 'done'        ? '已完成' : (st.phase || '—');
      updateBtn(st.scraper_running);
    } catch(e) {
      updateBtn(false);
    }

    // 从 API 获取类目列表（带筛选）
    const q  = document.getElementById('search').value;
    const df = document.getElementById('depthFilter').value;
    let apiUrl = '/api/categories?limit=2000';
    if (q)  apiUrl += '&q=' + encodeURIComponent(q);
    if (df !== 'all') apiUrl += '&depth=' + df;

    const cr = await fetch(apiUrl);
    allNodes = await cr.json();
    renderTable();
  } catch(e) {}
  document.getElementById('last_update').textContent = new Date().toLocaleTimeString();
}

function listBtn(label, url, valid, col, nodeId) {
  if (!url || !nodeId) return `<span class="lb lb-unknown">${label}</span>`;
  const cls = valid === 1 ? 'lb-valid' : valid === 0 ? 'lb-invalid' : 'lb-unknown';
  const href = valid === 1 ? `href="${url}" target="_blank"` : '';
  return `<a class="lb ${cls}" ${href}>${label}</a>`;
}

function buildListBtns(n) {
  if (!n.node_id) return '<span style="color:#333;font-size:11px">—</span>';
  const parts = (n.url || '').replace(/\/$/, '').split('/');
  const gpIdx = parts.indexOf('gp');
  const slug  = gpIdx >= 0 ? parts[gpIdx + 2] : '';
  const nid   = n.node_id;
  const base  = `https://www.amazon.com/gp`;
  return `<div class="list-btns">
    ${listBtn('新品', `${base}/new-releases/${slug}/${nid}/`,       n.nr_valid, 'nr_valid', nid)}
    ${listBtn('畅销', `${base}/bestsellers/${slug}/${nid}/`,        n.bs_valid, 'bs_valid', nid)}
    ${listBtn('飙升', `${base}/movers-and-shakers/${slug}/${nid}/`, n.ms_valid, 'ms_valid', nid)}
    ${listBtn('心愿', `${base}/most-wished-for/${slug}/${nid}/`,    n.mw_valid, 'mw_valid', nid)}
  </div>`;
}

function renderTable() {
  const rows = allNodes.map((n, i) => {
    const d   = n.depth || 0;
    const dc  = d>=5?'d5':d>=4?'d4':d>=3?'d3':d>=2?'d2':'d1';
    const indent = d * 16;
    const name = n.name && !n.name.match(/^\d+$/) ? n.name : '<span style="color:#555;font-style:italic">(未命名)</span>';
    const btns = buildListBtns(n);
    const refreshBtn = n.node_id
      ? `<button class="row-refresh" onclick="refreshRow('${n.node_id}',this)" title="重新验证此行">↺</button>`
      : '';
    return `<tr id="row-${n.node_id || i}">
      <td style="color:#555">${i+1}</td>
      <td style="padding-left:${indent}px">${name}</td>
      <td><span class="depth-badge ${dc}">L${d}</span></td>
      <td class="${n.node_id?'has-id':'no-id'}">${n.node_id||'—'}</td>
      <td class="${n.source==='breadcrumb'?'source-bc':'source-sb'}">${n.source||'sidebar'}</td>
      <td>${btns}</td>
      <td>${refreshBtn}</td>
    </tr>`;
  }).join('');
  document.getElementById('tbody').innerHTML = rows ||
    '<tr><td colspan="7" style="color:#555;padding:20px">暂无数据</td></tr>';
}

// ── 榜单验证 ────────────────────────────────────────
let _checkPollTimer = null;

async function startCheckAll() {
  const r = await fetch('/api/check_all', {method:'POST'}).then(r=>r.json());
  if (r.status === 'already_running') { alert('验证任务已在运行中'); return; }
  document.getElementById('checkBar').classList.add('active');
  pollCheckProgress();
}

async function pollCheckProgress() {
  clearTimeout(_checkPollTimer);
  try {
    const d = await fetch('/api/check_progress').then(r=>r.json());
    const pct = d.total > 0 ? Math.round(d.checked * 100 / d.total) : 0;
    document.getElementById('checkBarFill').style.width = pct + '%';
    document.getElementById('checkBarText').textContent =
      `${d.checked}/${d.total} (${pct}%) ${d.running ? '运行中...' : '完成'}`;
    const vc = d.valid_counts || {};
    document.getElementById('checkCounts').innerHTML =
      Object.entries(vc).map(([k,v])=>`<span style="color:#888">${k}:</span><span>${v}</span>`).join(' ');
    if (d.running) _checkPollTimer = setTimeout(pollCheckProgress, 2000);
  } catch(e) {}
}

async function refreshRow(nodeId, btn) {
  btn.textContent = '⏳'; btn.disabled = true;
  try {
    await fetch(`/api/check_node?node_id=${nodeId}`, {method:'POST'});
    // 子进程在后台跑，约3-5秒完成，延迟后刷新
    setTimeout(() => { load(); btn.textContent = '↺'; btn.disabled = false; }, 6000);
  } catch(e) {
    btn.textContent = '↺'; btn.disabled = false;
  }
}

function updateBtn(running) {
  const btn = document.getElementById('ctrlBtn');
  const dot = document.getElementById('statusDot');
  const txt = document.getElementById('statusText');
  if (running) {
    btn.className = 'ctrl-btn running';
    btn.textContent = '⏹ 停止抓取';
    dot.className = 'status-dot running';
    txt.textContent = '运行中';
  } else {
    btn.className = 'ctrl-btn paused';
    btn.textContent = '▶ 启动抓取';
    dot.className = 'status-dot paused';
    txt.textContent = '爬虫未运行';
  }
}

async function togglePause() {
  const btn = document.getElementById('ctrlBtn');
  const url = btn.textContent.includes('启动') ? '/api/start' : '/api/stop';
  try {
    const r = await fetch(url, { method: 'POST' });
    const d = await r.json();
    if (d.status === 'error') alert('操作失败: ' + d.msg);
    else load();
  } catch(e) { alert('连接失败，检查 dashboard_server.py 是否在运行'); }
}

load();
setInterval(load, 1000);

// ── 商品抓取面板 JS ───────────────────────────────────────────────

let _productPollTimer = null;
const _selectedRoots = new Set();

async function initProductsTab() {
  await loadProductTree();
  await refreshProductStats();
  startProductPoll();
}

// ── 商品 L1 类目列表（slug 勾选）────────────────────────────────
const _selectedSlugs = new Set();

async function loadProductTree() {
  const root = document.getElementById('pTreeRoot');
  root.innerHTML = '<div style="color:#555">⏳ 加载中...</div>';
  try {
    const items = await fetch('/api/l1_categories').then(r => r.json());
    root.innerHTML = '';
    items.forEach(it => root.appendChild(buildSlugRow(it)));
    if (!items.length) root.innerHTML = '<div style="color:#f07070">无 L1 类目数据</div>';
  } catch(e) {
    root.innerHTML = '<div style="color:#f07070">加载失败: ' + e + '</div>';
  }
}

function buildSlugRow(item) {
  const wrap = document.createElement('div');

  // ── 主行 ──
  const row = document.createElement('div');
  row.style.cssText = 'display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer';
  row.onmouseenter = () => row.style.background = '#1a2a3a';
  row.onmouseleave = () => row.style.background = '';

  // 展开箭头
  const arrow = document.createElement('span');
  arrow.textContent = '▶';
  arrow.style.cssText = 'font-size:9px;color:#555;width:12px;flex-shrink:0;transition:transform .18s;user-select:none';
  row.appendChild(arrow);

  // L1 checkbox（选整个 L1）
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.title = '选择整个 ' + item.name + ' 大类';
  cb.addEventListener('change', e => {
    e.stopPropagation();
    if (cb.checked) _selectedSlugs.add(item.slug);
    else _selectedSlugs.delete(item.slug);
    document.getElementById('p_sel_count').textContent = _selectedSlugs.size + ' 个已选';
  });
  row.appendChild(cb);

  const label = document.createElement('span');
  label.textContent = item.name;
  label.style.cssText = 'color:#ccc;font-size:12px;flex:1';
  label.setAttribute('data-label', '1');
  row.appendChild(label);

  const cnt = document.createElement('span');
  cnt.textContent = item.child_count + ' 类';
  cnt.style.cssText = 'color:#555;font-size:10px;flex-shrink:0';
  row.appendChild(cnt);

  wrap.appendChild(row);

  // ── 子节点容器（懒加载）──
  const childBox = document.createElement('div');
  childBox.style.cssText = 'display:none;margin-left:20px;border-left:1px solid #2a2d3e;padding-left:8px';
  wrap.appendChild(childBox);

  let expanded = false;
  let loaded   = false;

  row.addEventListener('click', async e => {
    if (e.target === cb) return;
    expanded = !expanded;
    arrow.style.transform = expanded ? 'rotate(90deg)' : '';
    arrow.style.color     = expanded ? '#7eb8f7' : '#555';
    childBox.style.display = expanded ? '' : 'none';

    if (expanded && !loaded) {
      loaded = true;
      childBox.innerHTML = '<div style="color:#555;font-size:11px;padding:4px">⏳ 加载中...</div>';
      try {
        const data = await fetch('/api/slug_children?slug=' + encodeURIComponent(item.slug)).then(r => r.json());
        childBox.innerHTML = '';
        if (!data.length) {
          childBox.innerHTML = '<div style="color:#555;font-size:11px;padding:4px">暂无子类目</div>';
          return;
        }
        data.forEach(node => childBox.appendChild(buildChildRow(node)));
      } catch(e) {
        childBox.innerHTML = '<div style="color:#f07070;font-size:11px">加载失败</div>';
      }
    }
  });

  return wrap;
}

function buildChildRow(node) {
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:3px';
  div.onmouseenter = () => div.style.background = '#1a2a3a';
  div.onmouseleave = () => div.style.background = '';

  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.dataset.nodeId = node.node_id;
  cb.addEventListener('change', () => {
    if (cb.checked) _selectedSlugs.add('__node__' + node.node_id);
    else _selectedSlugs.delete('__node__' + node.node_id);
    document.getElementById('p_sel_count').textContent = _selectedSlugs.size + ' 个已选';
  });
  div.appendChild(cb);

  const depthBadge = document.createElement('span');
  const d = node.depth || 0;
  const dc = d>=5?'d5':d>=4?'d4':d>=3?'d3':d>=2?'d2':'d1';
  depthBadge.className = 'depth-badge ' + dc;
  depthBadge.textContent = 'L' + d;
  div.appendChild(depthBadge);

  const name = document.createElement('span');
  name.textContent = node.name || '(未命名)';
  name.style.cssText = 'color:#aaa;font-size:11px;flex:1';
  div.appendChild(name);

  return div;
}

function filterPTree(q) {
  const kw = q.trim().toLowerCase();
  const root = document.getElementById('pTreeRoot');
  [...root.children].forEach(div => {
    const label = div.querySelector('span[data-label]');
    const text = (label ? label.textContent : '').toLowerCase();
    div.style.display = (!kw || text.includes(kw)) ? '' : 'none';
  });
}

async function refreshProductStats() {
  try {
    const r = await fetch('/api/product_stats');
    const d = await r.json();
    document.getElementById('p_total').textContent = d.total_asins || 0;
    document.getElementById('p_multi').textContent = d.multi_list || 0;
    const byList = {};
    (d.by_list || []).forEach(row => byList[row.list_type] = row.cnt);
    document.getElementById('p_nr').textContent = byList['new-releases']  || 0;
    document.getElementById('p_bs').textContent = byList['bestsellers']   || 0;
    document.getElementById('p_mw').textContent = byList['most-wished-for'] || 0;

    const running = d.running;
    document.getElementById('p_status').textContent = running ? '⚙ 抓取中...' : '就绪';
    document.getElementById('p_status').style.color  = running ? '#5fdb8a' : '#888';
  } catch(e) {}
}

function startProductPoll() {
  if (_productPollTimer) return;
  _productPollTimer = setInterval(refreshProductStats, 3000);
}

// ── 榜单子标签切换 ────────────────────────────────────────────────
function switchListTab(key) {
  ['nr','bs','mw'].forEach(k => {
    document.getElementById('lp_'+k).style.display = k===key ? '' : 'none';
    const btn = document.getElementById('ltab_'+k);
    btn.style.color = k===key ? '#7eb8f7' : '#888';
    btn.style.borderBottomColor = k===key ? '#7eb8f7' : 'transparent';
  });
}

// ── 收集每个榜单独立参数 ──────────────────────────────────────────
function collectListParams(key, listType) {
  const enabled = document.getElementById('len_'+key).checked;
  if (!enabled) return null;
  return {
    list_type:  listType,
    review_max: +document.getElementById('rv_'+key).value,
    min_list:   +document.getElementById('ml_'+key).value,
    price_min:  +document.getElementById('pmin_'+key).value,
    price_max:  +document.getElementById('pmax_'+key).value,
  };
}

async function startProducts() {
  const allSelected = [..._selectedSlugs].filter(Boolean);
  if (!allSelected.length) { alert('请在左侧勾选至少一个类目'); return; }

  // 区分 L1 slug 选择 和 具体子节点选择
  const slugs = allSelected.filter(s => !s.startsWith('__node__'));
  const roots = allSelected.filter(s => s.startsWith('__node__')).map(s => s.replace('__node__', ''));

  const enabledLists = [];
  if (document.getElementById('len_nr').checked) enabledLists.push('new-releases');
  if (document.getElementById('len_bs').checked) enabledLists.push('bestsellers');
  if (document.getElementById('len_mw').checked) enabledLists.push('most-wished-for');
  if (!enabledLists.length) { alert('请至少启用一个榜单'); return; }

  const params = {
    lists:      enabledLists,
    review_max: +document.getElementById('rv_nr').value,
    min_list:   +document.getElementById('ml_nr').value,
    price_min:  +document.getElementById('pmin_nr').value,
    price_max:  +document.getElementById('pmax_nr').value,
  };
  if (slugs.length) params.slugs = slugs;
  if (roots.length) params.roots = roots;

  try {
    const r = await fetch('/api/start_products', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(params)
    });
    const d = await r.json();
    if (d.status === 'already_running') alert('抓取进程已在运行中');
    else if (d.status === 'error') alert('启动失败: ' + d.msg);
    else {
      document.getElementById('p_status').textContent = `⚙ 已启动 PID=${d.pid}`;
      document.getElementById('p_status').style.color = '#5fdb8a';
    }
  } catch(e) { alert('启动失败: ' + e); }
}

async function stopProducts() {
  try {
    const r = await fetch('/api/stop_products', {method: 'POST'});
    const d = await r.json();
    document.getElementById('p_status').textContent = '已停止';
    document.getElementById('p_status').style.color = '#888';
  } catch(e) { alert('停止失败: ' + e); }
}

async function exportExcel() {
  document.getElementById('p_status').textContent = '导出中...';
  try {
    const r = await fetch('/api/export_excel', {method: 'POST'});
    const d = await r.json();
    if (d.status === 'ok') {
      document.getElementById('p_status').textContent = '✅ Excel 已导出到 data/products.xlsx';
    } else {
      document.getElementById('p_status').textContent = '❌ ' + (d.msg || '导出失败');
    }
  } catch(e) { alert('导出失败: ' + e); }
}
